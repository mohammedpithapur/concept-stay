<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verify Your Email - Concept Stay</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f7f5f0; margin: 0; padding: 40px 20px;">
  <div style="max-width: 500px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 12px; border: 1px solid #e2ded4; text-align: center;">
    <h2 style="color: #2c2523; font-size: 22px; margin-bottom: 8px;">Verify Your Email Address</h2>
    <p style="color: #666059; font-size: 14px; margin-bottom: 24px;">Use the 6-digit code below to complete your registration on Concept Stay.</p>
    <div style="background-color: #f3efe6; border: 2px dashed #c4a47c; padding: 16px; border-radius: 8px; font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #8c6a38; margin-bottom: 24px;">
      {{ code }}
    </div>
    <p style="color: #88827a; font-size: 12px;">This verification code will expire in 10 minutes. If you did not request this code, please ignore this email.</p>
  </div>
</body>
</html>
